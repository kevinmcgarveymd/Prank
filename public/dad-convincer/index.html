<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DAD CONVINCER 3000™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFE74C;
    --ink: #1a1a1a;
    --pop: #FF5964;
    --cool: #38A3A5;
    --warm: #FF9B42;
    --speech-bg: #fff8d6;
    --shadow: 6px 6px 0 var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink);
  }

  body.mom-mode {
    --bg: #F0E5FF;
    --pop: #B5179E;
    --cool: #06AED5;
    --warm: #FF6B9D;
    --speech-bg: #FFE5F1;
  }

  body, .speech, .panel {
    transition: background 0.5s ease, background-color 0.5s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding: 20px;
    background-image:
      radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--pop) 20%, transparent) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, color-mix(in srgb, var(--cool) 20%, transparent) 0%, transparent 40%);
    overflow-x: hidden;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    font-size: 24px;
    animation: twirl 4s ease-in-out infinite;
  }
  @keyframes twirl {
    0%, 100% { transform: rotate(0deg) scale(1); }
    50% { transform: rotate(180deg) scale(1.3); }
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 16px;
    justify-content: center;
  }

  .lang-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
    overflow-x: auto;
    padding: 4px 2px 8px;
    scrollbar-width: thin;
    -webkit-overflow-scrolling: touch;
  }
  .lang-bar::-webkit-scrollbar { height: 4px; }
  .lang-bar::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 4px; }
  .lang {
    flex-shrink: 0;
    font-family: 'Bungee', cursive;
    font-size: 0.7rem;
    padding: 7px 11px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    background: white;
    color: var(--ink);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.1s, background 0.2s;
    user-select: none;
    white-space: nowrap;
  }
  .lang:hover { background: #f3f3f3; }
  .lang.active {
    background: var(--ink);
    color: var(--bg);
    transform: translateY(-1px);
    box-shadow: 4px 4px 0 var(--pop);
  }

  .member-banner {
    width: 100%;
    font-family: 'Bungee', cursive;
    padding: 14px;
    border: 4px solid var(--ink);
    border-radius: 14px;
    background: linear-gradient(45deg, #FFD700 0%, #FFA500 50%, #FFD700 100%);
    background-size: 200% 200%;
    animation: shimmer 3s ease-in-out infinite;
    color: var(--ink);
    cursor: pointer;
    text-align: center;
    font-size: 0.95rem;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    transition: transform 0.1s, box-shadow 0.1s, padding 0.3s, font-size 0.3s;
    user-select: none;
  }
  .member-banner:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
  .member-banner:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--ink); }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  body.is-member .member-banner {
    background: linear-gradient(45deg, #06D6A0 0%, #38A3A5 50%, #06D6A0 100%);
    background-size: 200% 200%;
    font-size: 0.8rem;
    padding: 10px;
  }
  .member-banner .unlocked-text { display: none; }
  body.is-member .member-banner .locked-text { display: none; }
  body.is-member .member-banner .unlocked-text { display: inline; }

  /* Member-only buttons hidden unless member mode active */
  body:not(.is-member) .btn[data-member="true"] { display: none; }

  /* Gold accent + VIP tag on member buttons */
  .btn[data-member="true"] {
    position: relative;
    border-color: #DAA520;
    box-shadow: 6px 6px 0 #DAA520;
  }
  .btn[data-member="true"]::after {
    content: "★";
    position: absolute;
    top: -10px;
    right: -10px;
    background: #FFD700;
    color: var(--ink);
    font-family: 'Bungee', cursive;
    font-size: 0.7rem;
    width: 22px;
    height: 22px;
    border: 2px solid var(--ink);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(15deg);
    animation: starpulse 2s ease-in-out infinite;
  }
  @keyframes starpulse {
    0%, 100% { transform: rotate(15deg) scale(1); }
    50% { transform: rotate(15deg) scale(1.2); }
  }
  .tab {
    font-family: 'Bungee', cursive;
    font-size: 0.95rem;
    padding: 12px 20px;
    border: 4px solid var(--ink);
    background: white;
    color: var(--ink);
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.1s, background 0.2s;
    user-select: none;
  }
  .tab:first-child { border-radius: 14px 0 0 14px; border-right-width: 2px; }
  .tab:last-child { border-radius: 0 14px 14px 0; border-left-width: 2px; }
  .tab.active {
    background: var(--ink);
    color: var(--bg);
    transform: translateY(-2px);
    box-shadow: 5px 5px 0 var(--pop);
  }
  .tab:not(.active):hover { background: #f3f3f3; }

  header {
    text-align: center;
    margin-bottom: 24px;
    transform: rotate(-2deg);
  }

  h1 {
    font-family: 'Bungee Shade', cursive;
    font-size: clamp(2.2rem, 7vw, 4rem);
    line-height: 1;
    color: var(--pop);
    text-shadow: 4px 4px 0 var(--ink);
    letter-spacing: 1px;
  }

  .sub {
    font-family: 'Bungee', cursive;
    font-size: 0.9rem;
    background: var(--ink);
    color: var(--bg);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    margin-top: 10px;
    transform: rotate(2deg);
    border: 3px solid var(--ink);
  }
  .mission-text {
    outline: none;
    min-width: 40px;
    cursor: text;
    border-bottom: 2px dashed transparent;
    transition: border-color 0.2s;
  }
  .mission-text:hover { border-bottom-color: var(--bg); }
  .mission-text:focus {
    border-bottom-color: var(--pop);
    background: rgba(255,89,100,0.3);
  }
  .edit-hint {
    font-size: 0.7rem;
    opacity: 0.7;
    cursor: pointer;
  }

  .panel {
    background: white;
    border: 4px solid var(--ink);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 20px;
  }

  .meter-label {
    font-family: 'Bungee', cursive;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 1rem;
  }

  .pct {
    background: var(--pop);
    color: white;
    padding: 4px 12px;
    border: 3px solid var(--ink);
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
    font-size: 1.2rem;
    transition: transform 0.2s;
  }

  .meter {
    height: 32px;
    background: #f3f3f3;
    border: 3px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }
  .meter-fill {
    height: 100%;
    width: 0%;
    background: repeating-linear-gradient(
      45deg,
      var(--pop) 0 12px,
      var(--warm) 12px 24px
    );
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    border-right: 3px solid var(--ink);
  }

  .dad {
    text-align: center;
    margin: 16px 0;
    font-family: 'Bungee', cursive;
    font-size: 0.95rem;
  }
  .dad-face {
    font-size: 4rem;
    display: inline-block;
    transition: transform 0.3s;
  }
  .dad-status {
    background: var(--cool);
    color: white;
    padding: 6px 14px;
    border: 3px solid var(--ink);
    border-radius: 8px;
    display: inline-block;
    box-shadow: var(--shadow-sm);
    margin-top: 6px;
  }

  .speech {
    background: var(--speech-bg);
    border: 4px solid var(--ink);
    border-radius: 18px;
    padding: 18px 20px;
    min-height: 90px;
    position: relative;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    font-size: 1.15rem;
    font-weight: 900;
    line-height: 1.4;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform: rotate(-1deg);
  }
  .speech::after {
    content: "";
    position: absolute;
    bottom: -18px;
    left: 40px;
    width: 0;
    height: 0;
    border: 12px solid transparent;
    border-top-color: var(--ink);
  }
  .speech::before {
    content: "";
    position: absolute;
    bottom: -12px;
    left: 44px;
    width: 0;
    height: 0;
    border: 8px solid transparent;
    border-top-color: var(--speech-bg);
    z-index: 1;
  }

  .speech.shake {
    animation: shake 0.4s;
  }
  .speech.thinking {
    color: #888;
    font-style: italic;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  @keyframes shake {
    0%, 100% { transform: rotate(-1deg) translateX(0); }
    25% { transform: rotate(-3deg) translateX(-6px); }
    75% { transform: rotate(1deg) translateX(6px); }
  }

  .btn:disabled { opacity: 0.6; cursor: wait; }

  .buttons {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (min-width: 600px) {
    .buttons { grid-template-columns: repeat(3, 1fr); }
  }

  .btn {
    font-family: 'Bungee', cursive;
    border: 4px solid var(--ink);
    border-radius: 14px;
    padding: 16px 12px;
    font-size: 0.85rem;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.1s, box-shadow 0.1s;
    color: var(--ink);
    text-align: center;
    line-height: 1.2;
    user-select: none;
  }
  .btn:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
  .btn:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--ink); }

  .btn .icon { font-size: 1.8rem; display: block; margin-bottom: 6px; }

  .btn[class*="btn-"] { background: var(--pop); color: white; }

  /* Each parent mode gets its own button set */
  body:not(.mom-mode) .btn[data-mode="mom"] { display: none; }
  body.mom-mode .btn[data-mode="dad"] { display: none; }

  .reset {
    width: 100%;
    margin-top: 14px;
    background: var(--ink);
    color: var(--bg);
    font-family: 'Bungee', cursive;
    border: 4px solid var(--ink);
    border-radius: 14px;
    padding: 12px;
    cursor: pointer;
    font-size: 0.9rem;
    box-shadow: var(--shadow);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .reset:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--ink); }
  .reset:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 var(--ink); }

  .victory {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .victory.show { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .victory-card {
    background: var(--bg);
    border: 6px solid var(--ink);
    border-radius: 24px;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 12px 12px 0 var(--pop);
    max-width: 400px;
    animation: bounce-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes bounce-in {
    0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .victory-card h2 {
    font-family: 'Bungee Shade', cursive;
    font-size: 2.5rem;
    color: var(--pop);
    text-shadow: 3px 3px 0 var(--ink);
    margin-bottom: 12px;
  }
  .victory-card p {
    font-weight: 900;
    font-size: 1.1rem;
    margin-bottom: 20px;
  }
  .trophy { font-size: 5rem; display: block; margin-bottom: 8px; animation: spin 2s linear infinite; }
  @keyframes spin {
    0% { transform: rotate(0); }
    100% { transform: rotate(360deg); }
  }

  .floaty {
    position: absolute;
    pointer-events: none;
    font-family: 'Bungee', cursive;
    font-size: 1.5rem;
    color: var(--pop);
    text-shadow: 2px 2px 0 var(--ink);
    animation: floatUp 1.2s ease-out forwards;
    z-index: 50;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(0.5); }
    100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
  }

  .back-link {
    display: inline-block;
    font-family: 'Bungee', cursive;
    font-size: 0.75rem;
    color: var(--ink);
    text-decoration: none;
    padding: 6px 12px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    background: white;
    box-shadow: var(--shadow-sm);
    margin-bottom: 12px;
  }
  .back-link:hover { background: #f3f3f3; }

  footer {
    text-align: center;
    margin-top: 16px;
    font-family: 'Bungee', cursive;
    font-size: 0.7rem;
    opacity: 0.7;
  }
</style>
</head>

    const data = await r.json();
    const txt = data.content.map(b => b.text || "").join("").replace(/```json|```/g, "").trim();
    const parsed = JSON.parse(txt);
    if (!Array.isArray(parsed)) throw new Error("not array");
    return parsed.filter(s => typeof s === "string" && s.length > 0);
  }

  async function getArg(cat) {
    const m = getMission();
    const key = `${currentParent}|${currentLang}|${m}|${cat}`;
    if (!argCache[key] || argCache[key].length === 0) {
      if (loadingKeys.has(key)) return null;
      loadingKeys.add(key);
      try {
        argCache[key] = await fetchArgs(m, cat);
      } catch (e) {
        console.error(e);
        argCache[key] = [
          "Hmm, my brain is buffering. Try another button!",
          "I had an argument ready but I forgot it. Classic me."
        ];
      }
      loadingKeys.delete(key);
    }
    const i = Math.floor(Math.random() * argCache[key].length);
    return argCache[key].splice(i, 1)[0];
  }

  // Clear cache for non-default missions when mission changes
  let lastMission = getMission();
  mission.addEventListener("blur", () => {
    const newM = getMission();
    if (newM !== lastMission) {
      Object.keys(argCache).forEach(k => {
        if (!k.includes(`|${DEFAULT_MISSION}|`)) delete argCache[k];
      });
      lastMission = newM;
    }
  });

  document.querySelectorAll(".btn[data-cat]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const cat = btn.dataset.cat;
      const key = `${currentParent}|${currentLang}|${getMission()}|${cat}`;
      const willLoad = !argCache[key] || argCache[key].length === 0;

      if (willLoad) {
        speech.textContent = "🤔 thinking up an argument...";
        speech.classList.remove("shake");
        speech.classList.add("thinking");
        btn.disabled = true;
      }

      const line = await getArg(cat);
      btn.disabled = false;
      speech.classList.remove("thinking");

      if (!line) return;

      speech.textContent = line;
      void speech.offsetWidth;
      speech.classList.add("shake");

      const boost = Math.floor(Math.random() * 8) + 8;
      state[currentParent].power = Math.min(100, state[currentParent].power + boost);
      const power = state[currentParent].power;
      fill.style.width = power + "%";
      pct.textContent = power + "%";
      pct.style.transform = "scale(1.3)";
      setTimeout(() => pct.style.transform = "scale(1)", 200);

      popFloaty(btn, "+" + boost);
      updateDad();

      if (power >= 100) {
        victoryText.textContent = `${parentName()} has officially surrendered. "${getMission()}" — mission accomplished! Use this power wisely.`;
        setTimeout(() => victory.classList.add("show"), 600);
      }
    });
  });

  document.getElementById("reset").addEventListener("click", resetGame);

  function resetGame() {
    state[currentParent].power = 0;
    fill.style.width = "0%";
    pct.textContent = "0%";
    speech.textContent = `Tap a button to launch your argument at ${parentName()}! 🎯`;
    victory.classList.remove("show");
    updateDad();
  }

  // Initial render
  applyMode();
  renderTab();
</script>

</body>
</html>
